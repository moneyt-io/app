name: moneyt_pfm
description: "Personal Finance Manager"
publish_to: 'none'
version: 0.3.2+31

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path: ^1.9.0
  path_provider: ^2.1.5
  get_it: ^8.0.3
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.2.2
  flutter_expandable_fab: ^2.3.0
  screenshot: ^3.0.0
  share_plus: ^10.1.3
  file_picker: ^10.3.1
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.2
  flutter_contacts: ^1.1.9+2
  injectable: ^2.5.0
  equatable: ^2.0.7
  filesize: ^2.0.1
  slang: ^4.7.2
  slang_flutter: ^4.7.0
  intl: ^0.20.2
  confetti: ^0.7.0 
  superwallkit_flutter: ^2.4.1
  table_calendar: ^3.2.0
  collection: ^1.18.0
  flutter_dotenv: ^6.0.0
  fl_chart: ^1.1.1
  posthog_flutter: ^5.0.0
  tiktok_events_sdk: ^1.1.4
  app_tracking_transparency: ^2.0.4
  facebook_app_events: ^0.27.2
  google_fonts: ^8.1.0
  speech_to_text: ^7.3.0
  google_generative_ai: ^0.4.7
  sensors_plus: ^7.0.0
  image_picker: ^1.2.2
  app_links: ^7.0.0
  http: ^1.6.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/seeds/en/
    - assets/seeds/es/
    - assets/images/

flutter_launcher_icons:
  image_path: assets/logo/app_icon.png          # PNG transparente, sin fondo
  background_color: "#FFFFFF"                   # Solo Android legacy
  adaptive_icon_background: "#FFFFFF"           # Android capa bg
  remove_alpha_ios: true                        # iOS: aplana a fondo sólido
  ios: true
  android: true