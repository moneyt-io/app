<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
            70% { box-shadow: 0 0 0 40px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .floating-icon {
            animation: float-in 4s ease-out forwards;
        }
        @keyframes float-in {
            0% { opacity: 0; transform: scale(0.5) translate(var(--tw-translate-x), var(--tw-translate-y)); }
            100% { opacity: 1; transform: scale(1) translate(0, 0); }

<div class="fixed inset-0 z-0">

</div>

</div>

<span class="material-symbols-outlined text-headline-md">restaurant</span>
</div>

</div>

<span class="material-symbols-outlined text-headline-lg">mic</span>
</div>

<span class="material-symbols-outlined">history</span>
<span class="font-label-sm mt-1">Recentes</span>
</button>
</div>

<div class="h-32"></div>

<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-lg pb-lg pt-md backdrop-blur-md bg-surface/80 dark:bg-inverse-surface/80 shadow-lg rounded-t-xl md:hidden">

</div>
